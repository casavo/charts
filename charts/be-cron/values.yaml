image:
  repository:
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

# -- Custom labels to add into metadata
labels: {}
  # foo: bar

command: []
schedule: ""
suspend: false
concurrencyPolicy: Forbid
startingDeadlineSeconds: 300
successfulJobsHistoryLimit: 3
# -- How many failed Jobs to keep. Kubernetes' own default, made configurable:
# a retained Job keeps its Pod in Failed phase, which monitoring that watches
# pod phase reports as unhealthy for as long as the Job is kept around.
failedJobsHistoryLimit: 1
# -- Seconds after which a finished Job (succeeded or failed) is deleted along
# with its Pods. Unset by default, which keeps the current behaviour: Jobs are
# only evicted by the history limits above. Note that 0 is not supported here.
ttlSecondsAfterFinished:
backoffLimit: 0
restartPolicy: Never

resources:
  limits:
    memory: 200Mi
  requests:
    cpu: 100m
    memory: 100Mi

nodeSelector: {}

tolerations: []

affinity: {}
  # podAntiAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #   - labelSelector:
  #       matchExpressions:
  #       - key: app
  #         operator: In
  #         values:
  #         - example
  #     topologyKey: "kubernetes.io/hostname"

## Optional priorityClassName
priorityClassName: ""

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

env: {}
envFrom: []
envValueFrom: {}
  # POD_IP:
  #   fieldRef:
  #     fieldPath: status.podIP

## app configuration
config: {}
  # environment: debug

## app secrets
secrets: {}
  # password: foobar

configVolume:
  enabled: false
  # mountPath: /config
  # data:
  #   config.yaml: |
  #     environment: debug

secretsVolume:
  enabled: false
  # mountPath: /config
  # data:
  #   secrets.yaml: |
  #     password: foovar
